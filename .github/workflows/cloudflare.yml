name: Check and deploy to Cloudflare

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'
  CLOUDFLARE_CF_FETCH_ENABLED: 'false'

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm run install:ci
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Build Sites-compatible app
        run: npm run build
      - name: Build standalone Cloudflare app
        run: npm run build:cloudflare -- --check
      - name: Validate Worker upload without deploying
        run: npx --no-install wrangler deploy --dry-run --experimental-provision=false --config dist/server/wrangler.json

  deploy:
    name: Deploy Worker and D1 migrations
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-production
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      GIPHY_API_KEY: ${{ vars.GIPHY_API_KEY }}
      POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
      POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
      POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
      CUSTOM_DOMAINS_ZONE_ID: ${{ vars.CUSTOM_DOMAINS_ZONE_ID }}
      CUSTOM_DOMAINS_TARGET: ${{ vars.CUSTOM_DOMAINS_TARGET }}
      WYA_HOSTING_MODE: ${{ vars.WYA_HOSTING_MODE }}
      STRIPE_PRICE_USD_MONTHLY: ${{ vars.STRIPE_PRICE_USD_MONTHLY }}
      STRIPE_PRICE_BRL_MONTHLY: ${{ vars.STRIPE_PRICE_BRL_MONTHLY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm run install:ci
      - run: npm run build:cloudflare
      - name: Validate production target
        run: node scripts/check-cloudflare-deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check authentication secrets
        run: node scripts/check-auth-secrets.mjs
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          POSTHOG_READ_KEY: ${{ secrets.POSTHOG_READ_KEY }}
          DISCORD_FEEDBACK_WEBHOOK: ${{ secrets.DISCORD_FEEDBACK_WEBHOOK }}
          CUSTOM_DOMAINS_API_TOKEN: ${{ secrets.CUSTOM_DOMAINS_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      - name: Apply committed D1 migrations
        run: npx --no-install wrangler d1 migrations apply DB --remote --config .cloudflare/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Configure authentication secrets on the Worker
        run: node scripts/sync-auth-secrets.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          POSTHOG_READ_KEY: ${{ secrets.POSTHOG_READ_KEY }}
          DISCORD_FEEDBACK_WEBHOOK: ${{ secrets.DISCORD_FEEDBACK_WEBHOOK }}
          CUSTOM_DOMAINS_API_TOKEN: ${{ secrets.CUSTOM_DOMAINS_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      - name: Deploy tested Worker
        # Resources are created explicitly; CI must not provision new resources.
        run: npx --no-install wrangler deploy --experimental-provision=false --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify production MCP signing-key lookup
        run: node scripts/check-mcp-auth.mjs
      - name: Deployment summary
        run: echo 'Worker wya-im deployed with email-code sign-in and OAuth at https://wya.im/mcp. Existing domain attachment is managed in Cloudflare.' >> "$GITHUB_STEP_SUMMARY"
