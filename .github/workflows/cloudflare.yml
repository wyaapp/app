name: Check and deploy to Cloudflare

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'
  CLOUDFLARE_CF_FETCH_ENABLED: 'false'

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm run install:ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - name: Build Sites-compatible app
        run: npm run build
      - name: Build standalone Cloudflare app
        run: npm run build:cloudflare -- --check
      - name: Validate Worker upload without deploying
        run: npx --no-install wrangler deploy --dry-run --config dist/server/wrangler.json

  deploy:
    name: Deploy Worker and D1 migrations
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-production
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm run install:ci
      - run: npm run build:cloudflare
      - name: Validate production target
        run: node scripts/check-cloudflare-deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check authentication secrets
        run: node -e 'if (!process.env.BETTER_AUTH_SECRET || !process.env.RESEND_API_KEY) throw new Error("Configure authentication secrets before deployment")'
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      - name: Apply committed D1 migrations
        run: npx --no-install wrangler d1 migrations apply DB --remote --config .cloudflare/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Configure authentication secrets on the Worker
        run: node scripts/sync-auth-secrets.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      - name: Deploy tested Worker
        run: npx --no-install wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deployment summary
        run: echo 'Worker wya-im deployed with email-code sign-in and OAuth at https://wya.im/mcp. Existing domain attachment is managed in Cloudflare.' >> "$GITHUB_STEP_SUMMARY"
